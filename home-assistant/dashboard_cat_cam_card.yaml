# Cat cam card on the default dashboard (needs the WebRTC Camera custom card)
type: conditional
conditions:
- condition: state
  entity: switch.g3_flex_privatsphare_modus
  state: 'off'
card:
  type: custom:webrtc-camera
  entity: camera.living_room_cat_cam_high_resolution_channel
  ui: true
  ptz:
    service: script.cat_cam_pan
    data_left:
      direction: left
    data_right:
      direction: right
    data_home:
      direction: default
