# Script: script.cat_cam_pan  (Settings > Automations & scenes > Scripts > Add > Edit in YAML)
# Entity IDs to change to match your install:
#   number.living_room_camplatform_g3_flex_pan_angle  (from the ESPHome device; "G3 Flex Pan Angle")
alias: Cat Cam Pan
description: 'Turn the cat cam turntable: nudge left/right by 15° or go to the default +30°. Used by the cat cam card and the privacy-mode automation. Positive angles turn the camera to the right (seen
  from behind the camera).'
icon: mdi:pan-horizontal
mode: queued
fields:
  direction:
    name: Direction
    required: true
    default: default
    selector:
      select:
        options:
        - left
        - right
        - default
sequence:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ direction == ''left'' }}'
    sequence:
    - action: number.set_value
      target:
        entity_id: number.living_room_camplatform_g3_flex_pan_angle
      data:
        value: '{{ [states(''number.living_room_camplatform_g3_flex_pan_angle'') | float(0) - 15, -110] | max }}'
  - conditions:
    - condition: template
      value_template: '{{ direction == ''right'' }}'
    sequence:
    - action: number.set_value
      target:
        entity_id: number.living_room_camplatform_g3_flex_pan_angle
      data:
        value: '{{ [states(''number.living_room_camplatform_g3_flex_pan_angle'') | float(0) + 15, 110] | min }}'
  default:
  - action: number.set_value
    target:
      entity_id: number.living_room_camplatform_g3_flex_pan_angle
    data:
      value: 30
